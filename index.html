<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitinaTuning | Tutte le auto. Un'unica passione.</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #e60000;
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background-color: #000;
            border-bottom: 2px solid var(--primary-color);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-multimarchio {
            background-color: var(--primary-color);
            color: #fff;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-btn {
            background-color: #1a1a1a;
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .nav-btn:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }

        /* Menu Dropdown Social */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #141414;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            z-index: 1001;
            overflow: hidden;
            margin-top: 5px;
        }

        .dropdown-content a {
            color: #ffffff;
            padding: 10px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .dropdown-content a:hover {
            background-color: var(--primary-color);
            color: #fff;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #000;
        }

        .card-body {
            padding: 15px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-container">
                <img src="stemma-titinatuning.png" alt="TitinaTuning" class="logo-img" onerror="this.style.display='none'">
                <img src="stemma-motori-titinatuning.png" alt="TitinaTuning Motori" class="logo-img" onerror="this.style.display='none'">
                <div class="brand-title">
                    TitinaTuning
                    <span class="badge-multimarchio">Multimarchio</span>
                </div>
            </div>
            <nav>
                <a href="#raduni" class="nav-btn">I Nostri Raduni</a>
                <a href="#gallery" class="nav-btn">Gallery</a>
                
                <!-- Pulsante unico Social -->
                <div class="dropdown">
                    <button class="nav-btn">Social ▼</button>
                    <div class="dropdown-content">
                        <a href="https://www.instagram.com/titinatuning_2019/" target="_blank">Instagram</a>
                        <a href="https://www.facebook.com/profile.php?id=100089532213946" target="_blank">Facebook</a>
                        <a href="https://www.tiktok.com/@titinatuning" target="_blank">TikTok</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="raduni">
            <h2 class="section-title">I Nostri Raduni</h2>
            <div id="raduni-grid" class="grid">
                <p style="color: var(--text-muted);">Caricamento raduni e locandine...</p>
            </div>
        </section>

        <section id="gallery">
            <h2 class="section-title">Gallery Foto</h2>
            <div id="gallery-grid" class="grid">
                <p style="color: var(--text-muted);">Caricamento foto...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; TitinaTuning - Tutte le auto. Un'unica passione.</p>
    </footer>

</body>
</html>
