<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="TitinaTuning: community di appassionati di auto, tuning e raduni. Tutte le marche, una sola passione.">
  <title>TitinaTuning | Tutte le auto. Una sola passione.</title>
  <!-- Libreria Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #080909;
      --panel: #111313;
      --panel2: #171a18;
      --yellow: #dfff00;
      --yellow2: #b8d900;
      --white: #f4f5ef;
      --muted: #a7aca2;
      --line: rgba(223,255,0,.25);
      --max: 1180px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; color: var(--white); background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(var(--max), calc(100% - 40px)); margin-inline: auto; }
    .topline { height: 4px; background: var(--yellow); box-shadow: 0 0 18px rgba(223,255,0,.55); }
    header {
      position: sticky; top: 0; z-index: 100; background: rgba(8,9,9,.95);
      backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .nav { display:flex; align-items:center; justify-content:space-between; gap:20px; min-height:78px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:950; letter-spacing:.05em; font-size:1.18rem; }
    .brand-mark { display:grid; place-items:center; width:42px; height:42px; background:var(--yellow); color:#080909; font-weight:1000; font-size:1.1rem; transform:skew(-8deg); box-shadow:4px 4px 0 #697800; }
    .brand-wordmark { white-space:nowrap; }
    .brand-wordmark span { color:var(--yellow); }
    .navlinks { display:flex; gap:22px; align-items:center; font-size:.85rem; font-weight:750; text-transform:uppercase; }
    .navlinks a { transition:color .2s; }
    .navlinks a:hover { color:var(--yellow); }

    /* Stili Menu a Tendina Social */
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropdown-btn {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      font-weight: 750;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0;
      transition: color .2s;
    }
    .dropdown-btn:hover {
      color: var(--yellow);
    }
    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: var(--panel);
      min-width: 150px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.6);
      border: 1px solid var(--line);
      z-index: 101;
      padding: 8px 0;
      border-radius: 4px;
    }
    .dropdown-content a {
      color: var(--white);
      padding: 10px 16px;
      display: block;
      font-size: 0.82rem;
      text-transform: uppercase;
      font-weight: 750;
      transition: background .2s, color .2s;
    }
    .dropdown-content a:hover {
      background-color: rgba(223,255,0,.1);
      color: var(--yellow);
    }
    .dropdown:hover .dropdown-content {
      display: block;
    }

    .nav-cta, .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      padding:13px 18px; font-weight:900; text-transform:uppercase; letter-spacing:.04em;
      border:1px solid var(--yellow); background:var(--yellow); color:#090a08;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      transition:transform .2s, box-shadow .2s;
      cursor: pointer;
    }
    .btn:hover, .nav-cta:hover { transform:translateY(-2px); box-shadow:0 0 24px rgba(223,255,0,.24); }
    .btn.secondary { background:transparent; color:var(--yellow); }
    .menu-toggle { display:none; background:none; border:1px solid var(--line); color:var(--yellow); padding:8px 11px; font-size:1.25rem; }
    .hero {
      position:relative; overflow:hidden; min-height:680px; display:flex; align-items:center;
      background:
        linear-gradient(90deg, rgba(5,6,6,.98) 0%, rgba(5,6,6,.88) 42%, rgba(5,6,6,.3) 100%),
        linear-gradient(0deg, #080909 0%, transparent 32%),
        url("https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=2000&q=85") center 56%/cover;
    }
    .hero-content { position:relative; z-index:1; padding:95px 0 115px; max-width:760px; }
    .eyebrow { color:var(--yellow); font-weight:900; letter-spacing:.22em; text-transform:uppercase; font-size:.76rem; display:flex; gap:12px; align-items:center; }
    .eyebrow::before { content:""; width:36px; height:2px; background:var(--yellow); }
    h1 { font-size:clamp(3.1rem, 8vw, 7rem); line-height:.91; letter-spacing:-.065em; margin:24px 0; font-weight:1000; text-transform:uppercase; }
    h1 span { color:var(--yellow); display:block; text-shadow:0 0 34px rgba(223,255,0,.14); }
    .hero p { color:#d0d3cb; font-size:clamp(1rem, 1.7vw, 1.18rem); max-width:570px; margin:0 0 30px; }
    .hero-actions { display:flex; flex-wrap:wrap; gap:12px; }
    .hero-note { margin-top:48px; display:flex; gap:25px; flex-wrap:wrap; color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.1em; font-weight:800; }
    .hero-note strong { color:var(--white); }
    .hero-note span::before { content:"◆"; color:var(--yellow); margin-right:8px; font-size:.65rem; }
    .ticker { overflow:hidden; border-block:1px solid var(--line); background:var(--yellow); color:#090a08; }
    .ticker-inner { display:flex; gap:28px; align-items:center; width:max-content; padding:11px 0; font-size:.78rem; font-weight:1000; text-transform:uppercase; letter-spacing:.14em; animation:scroll 28s linear infinite; }
    .ticker-inner span::after { content:"✦"; margin-left:28px; }
    @keyframes scroll { to { transform:translateX(-50%); } }
    section { padding:92px 0; scroll-margin-top:70px; }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:30px; margin-bottom:34px; }
    .section-head h2 { margin:10px 0 0; font-size:clamp(2rem,4vw,3.7rem); line-height:1; letter-spacing:-.05em; text-transform:uppercase; }
    .section-head h2 span { color:var(--yellow); }
    .section-head p { color:var(--muted); max-width:420px; margin:0; }
    .eyebrow.small { font-size:.7rem; }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
    .card { background:var(--panel); border:1px solid rgba(255,255,255,.09); overflow:hidden; transition:transform .25s,border-color .25s; }
    .card:hover { transform:translateY(-5px); border-color:var(--yellow); }
    .card-image { height:210px; position:relative; background-size:cover; background-position:center; display:block; }
    .card-image::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg,rgba(8,9,9,.8),transparent 70%); }
    .card-image .number { position:absolute; z-index:1; top:14px; left:16px; color:var(--yellow); font-size:.76rem; font-weight:900; letter-spacing:.15em; }
    .card-body { padding:22px; }
    .card-body h3 { margin:0 0 8px; font-size:1.3rem; text-transform:uppercase; }
    .card-body p { margin:0; color:var(--muted); font-size:.94rem; }
    .tag { display:inline-block; color:var(--yellow); border:1px solid var(--line); padding:5px 8px; margin-top:17px; font-size:.68rem; text-transform:uppercase; font-weight:900; letter-spacing:.1em; }
    .event-meta { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .event-badge { display:inline-block; background:var(--yellow); color:#090a08; font-size:.7rem; font-weight:900; text-transform:uppercase; padding:4px 8px; letter-spacing:.08em; }

    /* STEMMI ORIGINALI */
    .emblems-section { background:#090a09; border-bottom:1px solid rgba(255,255,255,.06); }
    .emblems-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .emblem-card { min-height:300px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:28px; background:#050605; border:1px solid rgba(223,255,0,.25); }
    .emblem-card img { display: block; width: 100%; max-width: 380px; height: 220px; object-fit: contain; }
    .emblem-card span { color:var(--yellow); font-size:.75rem; font-weight:900; text-transform:uppercase; letter-spacing:.13em; text-align:center; }

    .dark-section { background:#0d0f0e; border-block:1px solid rgba(255,255,255,.06); }
    .brands { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
    .brand-pill { border:1px solid rgba(255,255,255,.15); padding:12px 17px; color:#e7e9e2; font-weight:850; text-transform:uppercase; font-size:.86rem; background:rgba(255,255,255,.025); }
    .brand-pill:hover { color:var(--yellow); border-color:var(--yellow); }
    .brand-pill.highlight { background:var(--yellow); color:#080909; font-weight:1000; border-color:var(--yellow); }
    
    .gallery { display:grid; grid-template-columns:1.2fr .8fr .8fr; grid-template-rows:190px 190px; gap:12px; }
    .gallery-item { background-size:cover; background-position:center; position:relative
